<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Notes — Dashboard</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><div class="logo"></div><h1>Acme Notes</h1></header>
<main>
  <h2>Your workspace</h2>
  <p class="sub">A throwaway app that exists only to prove the recording pipeline works.</p>

  <div class="card">
    <div class="row">
      <div>
        <strong>Notebook sync</strong>
        <div class="sub" style="margin:4px 0 0">Connect a notebook to store notes outside this browser.</div>
      </div>
      <div class="row" style="gap:12px">
        <span class="badge" data-testid="sync-status" id="status">Not connected</span>
        <button data-testid="connect-notebook" id="connect">Connect notebook</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:14px">
      <strong>Notes</strong>
      <button class="ghost" data-testid="new-note" id="new-note">New note</button>
    </div>
    <ul data-testid="note-list" id="list"></ul>
  </div>

  <div class="spacer"></div>
  <p class="sub">Scrolling down here gives the scenario something to scroll through.</p>
</main>
<script src="/app.js"></script>
<script>
  const state = window.acmeDemo.load();
  const status = document.getElementById('status');
  const connect = document.getElementById('connect');
  const list = document.getElementById('list');

  function render() {
    if (state.connected) {
      status.textContent = 'Connected';
      status.classList.add('on');
      connect.textContent = 'Disconnect';
      connect.dataset.testid = 'disconnect-notebook';
    } else {
      status.textContent = 'Not connected';
      status.classList.remove('on');
      connect.textContent = 'Connect notebook';
      connect.dataset.testid = 'connect-notebook';
    }
    list.innerHTML = state.notes.length
      ? state.notes.map((n) =>
          `<li data-testid="note-item"><div>${n.title}</div><div class="when">saved ${n.when}</div></li>`).join('')
      : '<li class="empty" data-testid="note-empty">No notes yet.</li>';
  }

  connect.addEventListener('click', () => {
    state.connected = !state.connected;
    window.acmeDemo.save(state);
    render();
  });
  document.getElementById('new-note').addEventListener('click', () => {
    location.href = '/note.html';
  });

  render();
</script>
</body>
</html>
